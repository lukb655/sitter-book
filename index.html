<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sitter Book</title>
<meta name="theme-color" content="#6E3A8C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sitter Book">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
[hidden]{display:none!important}

/* Layout: single-column phone app — sticky header, tab panels, fixed bottom nav */
:root{
  --bg:#F5F4FA; --surface:#FFFFFF; --line:#E3E0EE; --fg:#211E2B; --muted:#6B6680;
  --accent:#6E3A8C; --accent-soft:#EFE6F5; --money:#1F7A63; --money-soft:#E2F3EC;
  --oncall:#A0620A; --oncall-soft:#FBF0DC; --danger:#B3261E;
  --display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15131C; --surface:#1F1C29; --line:#332F40; --fg:#EEEBF5; --muted:#A39DB8;
  --accent:#C79BE0; --accent-soft:#33264A; --money:#5CCFA8; --money-soft:#173A30;
  --oncall:#F0B456; --oncall-soft:#3D2E14; --danger:#F2867E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15131C; --surface:#1F1C29; --line:#332F40; --fg:#EEEBF5; --muted:#A39DB8;
  --accent:#C79BE0; --accent-soft:#33264A; --money:#5CCFA8; --money-soft:#173A30;
  --oncall:#F0B456; --oncall-soft:#3D2E14; --danger:#F2867E; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.02em;margin:0}
h2{font-family:var(--display);font-weight:600;font-size:18px;margin:0;text-wrap:balance}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--money)}
section.panel{display:flex;flex-direction:column;gap:18px}
.label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
/* clock */
.clock{background:var(--accent);color:var(--bg);border:0;border-radius:18px;padding:18px}
.clock.idle{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.timer{font-family:var(--display);font-weight:800;font-size:44px;letter-spacing:-.02em;line-height:1}
.clock select{width:100%}
/* pay */
.pay{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat b{display:block;font-family:var(--display);font-size:26px;font-weight:800;letter-spacing:-.01em}
.stat.money b{color:var(--money)}
/* lists */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:flex;gap:12px;padding:13px 14px;border-top:1px solid var(--line);align-items:flex-start}
.item:first-child{border-top:0}
.item .main{flex:1;min-width:0}
.item .title{font-weight:600}
.date{flex:none;width:46px;text-align:center;border-radius:10px;background:var(--accent-soft);color:var(--accent);padding:5px 0}
.date .d{font-family:var(--display);font-weight:800;font-size:20px;line-height:1}
.date .m{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.chip.oncall{background:var(--oncall-soft);color:var(--oncall)}
.chip.paid{background:var(--money-soft);color:var(--money)}
.chip.ex{background:var(--line);color:var(--muted)}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
/* controls */
button,.btn{font:inherit;font-weight:600;font-size:14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:9px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.clock:not(.idle) button.primary{background:var(--bg);color:var(--accent);border-color:var(--bg)}
button.ghost{background:transparent}
button.danger{color:var(--danger)}
button.sm,.btn.sm{padding:6px 10px;font-size:13px}
button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;font-size:16px;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
textarea{min-height:64px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:7px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent)}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));display:flex;justify-content:center}
nav .in{display:flex;max-width:560px;width:100%}
nav button{flex:1;flex-direction:column;gap:2px;border:0;background:transparent;font-size:11px;color:var(--muted);padding:6px 0}
nav button svg{width:22px;height:22px}
nav button[aria-current="page"]{color:var(--accent)}
/* sheet */
.sheet{position:fixed;inset:0;z-index:20;background:rgb(0 0 0 / .45);display:flex;align-items:flex-end;justify-content:center}
.sheet .body{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;font-weight:600}
.notice{font-size:13px;background:var(--oncall-soft);color:var(--oncall);border-radius:12px;padding:10px 12px}
@media (prefers-reduced-motion:no-preference){.sheet .body{animation:up .2s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}

.signin{min-height:70vh;display:flex;flex-direction:column;justify-content:center;gap:16px;text-align:left}
.signin h1{font-size:40px}
.signin p{margin:0;color:var(--muted);max-width:34ch}
.who{font-size:12px;color:var(--muted)}

</style>
</head>
<body>
<div class="wrap" id="signin" hidden>
  <div class="signin">
    <h1>Sitter Book</h1>
    <p>Families, shifts, hours and pay in one place. Sign in with the Google account that has access.</p>
    <div><button class="primary" id="signinBtn">Sign in with Google</button></div>
    <div class="small" id="signinMsg"></div>
  </div>
</div>
<div id="app" hidden>
<div class="wrap">
  <header>
    <h1>Sitter Book</h1>
    <div class="sync"><span class="dot" id="syncDot"></span><span id="syncText">Connecting…</span></div>
    <button class="sm ghost" id="acctBtn" hidden>Account</button>
  </header>

  <section class="panel" id="p-home"></section>
  <section class="panel" id="p-schedule" hidden></section>
  <section class="panel" id="p-families" hidden></section>
  <section class="panel" id="p-hours" hidden></section>
</div>

<nav><div class="in">
  <button data-tab="home" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Today</button>
  <button data-tab="schedule"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Schedule</button>
  <button data-tab="families"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M16.5 14.6c2.5.2 4.3 2 5 5"/></svg>Families</button>
  <button data-tab="hours"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 6.5c0-1.9-2.2-3-5-3s-5 1.3-5 3.3 2 2.7 5 3.2 5 1.3 5 3.5-2.2 3.5-5 3.5-5-1.2-5-3"/></svg>Hours &amp; Pay</button>
</div></nav>

<div class="sheet" id="sheet" hidden><div class="body" id="sheetBody"></div></div>
<div class="toast" id="toast" hidden></div>
</div>
<script src="https://accounts.google.com/gsi/client" async></script>
<script type="module" src="app.js"></script>
</body>
</html>
